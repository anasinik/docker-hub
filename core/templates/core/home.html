{% extends "base.html" %}

{% block content %}

        <h1>Docker Hub</h1>
        <p>Find, share and manage container images.</p>
    </section>

    <section aria-labelledby="repositories-title">
        <div class="section-header">
            <h2 id="repositories-title">

            <a href="{% url 'repository_search' %}" class="filter-clear">

        </div>

        {% include "repositories/partials/repository_list.html" with repositories=repositories only %}
    </section>
{% endblock %}
