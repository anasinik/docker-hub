services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: dockerhub-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  registry:
    image: registry:2.8.3
    container_name: dockerhub-registry
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry_data:/var/lib/registry
      - ./docker/registry/config.yml:/etc/docker/registry/config.yml:ro
      # Only the certificate; the private key stays with the Django app.
      # create_host_path: false makes compose fail if the file is missing,
      # instead of creating an empty directory in its place.
      - type: bind
        source: ./docker/registry/auth/token.crt
        target: /etc/docker/registry/auth/token.crt
        read_only: true
        bind:
          create_host_path: false
    environment:
      REGISTRY_AUTH_TOKEN_REALM: ${REGISTRY_TOKEN_REALM:-http://host.docker.internal:8000/registry/token/}
      # Webhook for tag sync. The registry reads the whole list as YAML; pull
      # and blob events are not sent.
      REGISTRY_NOTIFICATIONS_ENDPOINTS: |
        - name: django
          url: ${REGISTRY_EVENTS_URL:-http://host.docker.internal:8000/registry/events/}
          headers:
            Authorization: [Bearer ${REGISTRY_EVENTS_TOKEN:?Set REGISTRY_EVENTS_TOKEN in .env}]
          # A sync takes a few registry calls; retries are harmless but wasteful.
          timeout: 15s
          threshold: 5
          backoff: 10s
          ignore:
            actions: [pull]
            mediatypes: [application/octet-stream]
    networks:
      - registry
    healthcheck:
      # The image has busybox wget, not curl.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:5001/debug/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: dockerhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - staticfiles:/usr/share/nginx/html/static:ro
    networks:
      proxy:
        ipv4_address: 172.30.0.2
      registry:

volumes:
  es_data:
  registry_data:
  staticfiles:

networks:
  proxy:
    name: dockerhub-proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

  registry:
    name: dockerhub-registry
    driver: bridge

  backend:
    name: dockerhub-backend
    driver: bridge