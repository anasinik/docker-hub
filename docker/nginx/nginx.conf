# HTTP -> HTTPS
server {
    listen 80;
    server_name localhost registry.example.com;

    return 301 https://$host$request_uri;
}


# Django application
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/app-cert.pem;
    ssl_certificate_key /etc/nginx/certs/app-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    # Django static files
    location /static/ {
        alias /usr/share/nginx/html/static/;

        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Django application
    location / {
        set $django_upstream django:8000;

        resolver 127.0.0.11 valid=10s ipv6=off;

        proxy_pass http://$django_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_redirect off;
    }
}


# Docker Registry
server {
    listen 443 ssl;
    server_name registry.example.com;

    ssl_certificate /etc/nginx/certs/registry-cert.pem;
    ssl_certificate_key /etc/nginx/certs/registry-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 0;

    location /v2/ {
        set $registry_upstream registry:5000;

        resolver 127.0.0.11 valid=10s ipv6=off;

        proxy_pass http://$registry_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;

        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        return 404;
    }
}