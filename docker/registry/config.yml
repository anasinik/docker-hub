# Configuration of the Distribution (registry:2) container, see
# https://distribution.github.io/distribution/about/configuration/
version: 0.1

log:
  level: info
  fields:
    service: registry

storage:
  filesystem:
    # Mounted from the registry_data volume in docker-compose.yml
    rootdirectory: /var/lib/registry
  # Allows deleting manifests through the API (deleting tags and repositories)
  delete:
    enabled: true
  cache:
    blobdescriptor: inmemory
  maintenance:
    # Remove unfinished uploads older than a week
    uploadpurging:
      enabled: true
      age: 168h
      interval: 24h
      dryrun: false

http:
  host: https://registry.example.com
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]
  # Internal port with /debug/health, used by the docker compose health check.
  # It stays open when authentication is added to port 5000.
  debug:
    addr: :5001

# Token authentication: Docker clients get a token from the Django app
# (repositories.views.RegistryTokenView), which checks the user and the
# repository permissions. The registry only verifies the token signature.
auth:
  token:
    # Address of the token endpoint as seen by the Docker daemon. Overridden by
    # REGISTRY_TOKEN_REALM in .env (docker-compose.yml). The default works with
    # "runserver 0.0.0.0:8000" on the host and Docker Desktop.
    realm: http://host.docker.internal:8000/registry/token/
    # Must match REGISTRY_TOKEN_SERVICE and REGISTRY_TOKEN_ISSUER in settings.py
    service: dockerhub-registry
    issuer: dockerhub-token-issuer
    # Created by "python manage.py generate_registry_keys"
    rootcertbundle: /etc/docker/registry/auth/token.crt

# Notifications: after a push or delete the registry calls the Django app
# (repositories.views.RegistryEventsView), which syncs the repository's tags.
# The endpoint list is set in docker-compose.yml (REGISTRY_NOTIFICATIONS_ENDPOINTS),
# because its URL and secret come from .env.

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
